[package]
name = "hax-lib"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
edition = "2021"
repository.workspace = true
readme = "README.md"
description = "Hax-specific helpers for Rust programs"


[target.'cfg(hax)'.dependencies]
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }

[dependencies]
hax-lib-macros = { workspace = true, optional = true }

[features]
default = ["macros"]
macros = ["dep:hax-lib-macros"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hax)'] }

[package.metadata.docs.rs]
# `--cfg hax` is passed to rustdoc so that docs.rs documents the `cfg(hax)`
# implementation of the library (see `src/lib.rs`). It is also passed as a
# `RUSTFLAGS` (via `rustc-args`), otherwise Cargo doesn't see the `hax` cfg
# when resolving the target-specific `[target.'cfg(hax)'.dependencies]`, and
# documenting fails with unresolved `num_bigint`/`num_traits` crates.
rustc-args = ["--cfg", "hax"]
rustdoc-args = ["--cfg", "doc_cfg", "--cfg", "hax"]
