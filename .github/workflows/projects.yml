name: Projects

# Runs the hax pipeline of the projects that use hax — extraction, then the
# proofs — against the hax in this checkout, rather than against the
# published `hax-lib` those projects pin.
#
# The projects are listed in `.github/hax-projects.json`; adding one is a
# single entry there, giving its repository, the directory to run in, the F*
# version it pins and the commands for each stage. Nothing else in this
# workflow knows about any particular project.
#
# Nightly, because it is the projects and their pinned toolchains that move
# under a hax that was fine when it landed, and because a full extraction plus
# lax-check is far too slow to put in front of a pull request. A failing
# nightly opens one issue per project, deduplicated by title, so a breakage
# that lasts a week is one issue rather than seven.
#
# On demand, `workflow_dispatch` takes a hax ref and a project ref, which is
# how a hax change that needs a matching project change is tested before
# either lands:
#
#   gh workflow run projects.yml --ref my-hax-branch \
#     -f projects=libcrux-ml-kem -f project-ref=my-libcrux-branch
#
# This replaces the per-project `bertie.yml`, `mlkem.yml` and `mldsa.yml`
# workflows, which ran on pull requests and in the merge queue. They could
# not do anything useful there: `cargo-hax` accepts only the `hax-lib` of its
# own version, so between a version bump and the release that publishes it —
# which is most of the time — those jobs either skipped every real step or
# failed on the version check. Their in-repo `[patch.crates-io]` injection
# never took effect either; see the `use-local-hax-lib` action.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: >-
          Which projects to run: a comma-separated list of names from
          .github/hax-projects.json, or "all".
        default: all
      hax-ref:
        description: >-
          The hax branch, tag or commit to test. Defaults to the ref this
          run was dispatched from.
        default: ''
      project-ref:
        description: >-
          The branch, tag or commit of each project repository. Defaults to
          its default branch.
        default: ''
      stage:
        description: >-
          How far to go: "extract", "lax" (the default, what the nightly
          runs) or "prove" for the full proofs.
        type: choice
        options: [lax, extract, prove]
        default: lax

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.projects }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The projects to run, as a matrix, from the one file that lists them.
  plan:
    if: github.repository == 'cryspen/hax'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        env:
          # Empty on a schedule, where every project runs.
          PROJECTS: ${{ inputs.projects || 'all' }}
        run: |
          set -euo pipefail
          names=$(jq -cn --arg s "$PROJECTS" \
            '$s | split(",") | map(sub("^ +";"") | sub(" +$";"")) | map(select(. != ""))')
          matrix=$(jq -c --argjson names "$names" '
            [.[].name] as $known
            | ($names - ["all"]) as $requested
            | ($requested - $known) as $unknown
            | if ($unknown | length) > 0 then
                ("unknown project(s): " + ($unknown | join(", "))
                  + ". Known projects: " + ($known | join(", "))) | halt_error
              elif ($names | index("all")) then {include: .}
              else {include: [.[] | select(.name | IN($requested[]))]}
              end
          ' .github/hax-projects.json)
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "::error::no project selected by '$PROJECTS'"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq '.include | map(.name)' <<< "$matrix"

  run:
    needs: plan
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    permissions:
      contents: read
      issues: write

    env:
      CARGO_TERM_COLOR: always
      # Empty on a schedule, which stops after the lax-check.
      STAGE: ${{ inputs.stage || 'lax' }}
      # Bertie's F* makefiles take the proof libraries from here, so the
      # proof libraries under test are this checkout's. libcrux's take them
      # from `cargo metadata`, which the injection below has pointed here.
      HAX_HOME: ${{ github.workspace }}/hax

    steps:
      # Building hax, a full F* installation and an extraction of a whole
      # crate together outgrow the default image's free space.
      - name: Free disk space by removing preinstalled packages
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Check out hax
        uses: actions/checkout@v4
        with:
          path: hax
          ref: ${{ inputs.hax-ref }}

      - name: Check out ${{ matrix.repository }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: project
          ref: ${{ inputs.project-ref }}

      # Reported in the issue a failing nightly opens: "the nightly is red"
      # is only actionable with the two commits it was red on.
      - name: Record the versions under test
        id: versions
        run: |
          set -euo pipefail
          echo "hax=$(git -C hax rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "project=$(git -C project rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: hax
          skipPush: true
          extraPullNames: fstar-nix-versions, z3-nix-versions

      # From the checkout, so this is the hax under test: the engine and the
      # proof libraries as well as `hax-lib`.
      - name: Build and install hax
        run: nix profile install ./hax

      - name: Install F* ${{ matrix.fstar }}
        env:
          VERSION: ${{ matrix.fstar }}
        run: |
          set -euo pipefail
          url="https://github.com/FStarLang/FStar/releases/download/$VERSION/fstar-$VERSION-Linux-x86_64.tar.gz"
          if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              -o /tmp/fstar.tar.gz "$url"; then
            mkdir -p "$HOME/.fstar"
            tar -xzf /tmp/fstar.tar.gz -C "$HOME/.fstar" --strip-components=2
            echo "$HOME/.fstar/bin" >> "$GITHUB_PATH"
          else
            echo "::notice::no prebuilt F* $VERSION for this platform; building it"
            nix profile install "github:FStarLang/FStar/$VERSION"
          fi

      # A separate step, so that the `PATH` the one above exported is in
      # effect. The projects' makefiles want `FSTAR_HOME`, which is wherever
      # of the two installations above actually provided `fstar.exe`.
      - name: Locate the F* installation
        run: |
          set -euo pipefail
          home="$(cd "$(dirname "$(command -v fstar.exe)")/.." && pwd)"
          echo "FSTAR_HOME=$home" >> "$GITHUB_ENV"
          fstar.exe --version

      - name: Use the hax-lib from this checkout
        uses: ./hax/.github/actions/use-local-hax-lib
        with:
          project: project
          hax: hax

      - name: Extract
        id: extract
        working-directory: project/${{ matrix.directory }}
        run: ${{ matrix.extract }}

      - name: Lax-check
        id: lax
        if: env.STAGE != 'extract'
        working-directory: project/${{ matrix.directory }}
        run: ${{ matrix.lax }}

      - name: Prove
        id: prove
        if: env.STAGE == 'prove'
        working-directory: project/${{ matrix.directory }}
        run: ${{ matrix.prove }}

      # The extraction is worth keeping even when the proofs fail on it:
      # it is what the failure has to be read against.
      - name: ↑ Upload the extraction
        if: always() && steps.extract.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: extraction-${{ matrix.name }}
          path: project/**/proofs/fstar
          include-hidden-files: true
          if-no-files-found: warn

      # Only the nightly opens issues: a dispatched run has someone watching
      # it. `open-issue-once` skips a title that is already open, so a
      # breakage lasting a week is one issue, not seven.
      - name: Open an issue for a failing nightly
        if: failure() && github.event_name == 'schedule'
        uses: ./hax/.github/actions/open-issue-once
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: ci
          title: Nightly hax run of ${{ matrix.name }} is failing
          body: |-
            The nightly [Projects](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) run of `${{ matrix.name }}` failed.

            | | |
            |---|---|
            | hax | [`${{ steps.versions.outputs.hax }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.versions.outputs.hax }}) |
            | ${{ matrix.repository }} | [`${{ steps.versions.outputs.project }}`](${{ github.server_url }}/${{ matrix.repository }}/commit/${{ steps.versions.outputs.project }}) |
            | extraction | `${{ steps.extract.outcome }}` |
            | lax-check | `${{ steps.lax.outcome }}` |

            A stage reported as `skipped` did not run because something
            before it failed — the setup steps included; the run's log says
            which.

            To reproduce, or to test a fix in either repository:

            ```
            gh workflow run projects.yml \
              -f projects=${{ matrix.name }} \
              -f hax-ref=<hax branch> \
              -f project-ref=<${{ matrix.repository }} branch>
            ```
