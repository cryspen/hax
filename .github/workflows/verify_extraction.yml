name: Test backend verification

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  tests:
    name: nix-action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: cachix/cachix-action@v15
      with:
        name: hax
        skipPush: true
        extraPullNames: fstar-nix-versions, z3-nix-versions

    - name: Install the toolchain
      run: |
        nix profile install nixpkgs#yq
        nix profile install .#rustc
        nix profile install .

    - name: Verify F* tests
      run: |
        nix develop .#ci-examples --command just test -b fstar -j 1

    - name: Verify Lean tests
      run: |
        nix develop .#ci-examples --command bash -c \
          "elan default \$(cat hax-lib/proof-libs/legacy-lean/lean-toolchain) && lake build --dir hax-lib/proof-libs/legacy-lean && just test -b legacy-lean"

    - name: Try to extract Rust By Examples
      run: |
        nix build .#rust-by-example-hax-extraction -L

  list-examples:
    name: list-examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
    - uses: actions/checkout@v4
    - uses: extractions/setup-just@v4
    - name: List the examples
      id: list
      run: |
        examples=$(just list-examples | jq -Rsc 'split("\n") | map(select(length > 0)) | if length == 0 then error("no examples found") else . end')
        echo "examples=$examples" >> "$GITHUB_OUTPUT"

  examples:
    name: example-${{ matrix.example }}
    needs: list-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.list-examples.outputs.examples) }}
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space by removing preinstalled packages
      uses: jlumbroso/free-disk-space@main
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: cachix/cachix-action@v15
      with:
        name: hax
        skipPush: true
        extraPullNames: fstar-nix-versions, z3-nix-versions

    - name: Build the example
      env:
        EXAMPLE: ${{ matrix.example }}
      run: |
        unset CI # Allows us to use Aeneas's olean cache
        nix develop .#ci-examples --command just check-example "$EXAMPLE"

  # Stable check for all examples: a skipped matrix (e.g. because listing the
  # examples failed) must be reported as a failure, not as a success.
  examples-result:
    name: examples-result
    needs: [list-examples, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check the results
      env:
        RESULTS: ${{ needs.list-examples.result }} ${{ needs.examples.result }}
      run: |
        echo "$RESULTS"
        [ "$RESULTS" = "success success" ]