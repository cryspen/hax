name: Test Workspace

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-workspace:
    strategy:
      fail-fast: false
      matrix:
        # Every platform hax supports, so that the platform-dependent parts
        # of the workspace (notably tool version management: the cache, its
        # atomic installs, and the manifest's per-platform keys) are covered
        # on each.
        os:
          - ubuntu-latest    # linux-x86_64
          - ubuntu-24.04-arm # linux-aarch64
          - macos-latest     # macos-aarch64
          - macos-15-intel   # macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --exclude hax-engine-names-extract --exclude hax-rust-engine --verbose

      - name: Test `hax-frontend-exporter` with feature `rustc` off
        run: cargo check -p hax-frontend-exporter --no-default-features --verbose

  no-std-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build no-std
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build -p hax-lib --target thumbv7em-none-eabi
