name: Use a local hax-lib
description: >-
  Point a project's dependencies on hax's library crates at a local hax
  checkout, and check that the project's workspace members really point there.

inputs:
  project:
    description: Path to the project checkout to repoint.
    required: true
  hax:
    description: Path to the hax checkout to depend on.
    default: .

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        HAX: ${{ inputs.hax }}
      run: |
        set -euo pipefail
        project=$(cd "$PROJECT" && pwd)
        hax=$(cd "$HAX" && pwd)

        crates=$(cargo metadata --format-version 1 --no-deps \
            --manifest-path "$hax/Cargo.toml" \
          | jq -r '.packages[] | select(.name | startswith("hax-"))
                   | "\(.name) \(.manifest_path | rtrimstr("/Cargo.toml"))"')

        cd "$project"

        edges=$(cargo metadata --format-version 1 --no-deps | jq -r '
          .packages[] as $p | $p.dependencies[]
          | select(.name | startswith("hax-"))
          | [$p.name, .name, (.kind // "normal"), (.target // "-"),
             (.uses_default_features | tostring), (.features | join(","))]
          | @tsv' | sort -u)

        if [ -z "$edges" ]; then
          echo "::error::no dependency on a hax crate anywhere in $project"
          exit 1
        fi

        # The flags naming the table an edge lives in, shared by `cargo remove`
        # and `cargo add`.
        table() {
          flags=()
          case "$1" in
            dev) flags+=(--dev) ;;
            build) flags+=(--build) ;;
          esac
          [ "$2" = "-" ] || flags+=(--target "$2")
        }

        # Cargo rejects a manifest that gives one crate two sources, so a crate
        # a member declares in several tables has to leave all of them first.
        duplicates=$(cut -f1,2 <<<"$edges" | uniq -d)
        while IFS=$'\t' read -r member dep kind target _ _; do
          grep -qxF "$(printf '%s\t%s' "$member" "$dep")" <<<"$duplicates" || continue
          table "$kind" "$target"
          cargo remove "$dep" -p "$member" ${flags[@]+"${flags[@]}"} --quiet
        done <<<"$edges"

        while IFS=$'\t' read -r member dep kind target defaults features; do
          path=$(awk -v d="$dep" '$1 == d {print $2}' <<<"$crates")
          if [ -z "$path" ]; then
            echo "::error::$member depends on $dep, which $hax does not provide"
            exit 1
          fi
          table "$kind" "$target"
          # Rewriting the edge replaces whatever it inherited from the
          # workspace, so its feature selection has to be restated here.
          [ "$defaults" = true ] || flags+=(--no-default-features)
          [ -z "$features" ] || flags+=(--features "$features")
          label="$kind"
          [ "$target" = "-" ] || label="$kind, $target"
          cargo add "$dep" --path "$path" -p "$member" \
            ${flags[@]+"${flags[@]}"} --quiet
          echo "$member: $dep ($label) -> $path"
        done <<<"$edges"

        metadata=$(cargo metadata --format-version 1)

        # The edges to a registry or git hax crate that start from a workspace
        # member (`true`) or from any other non-hax crate (`false`).
        stray() {
          jq -r --argjson member "$1" '
            (.packages | map({key: .id, value: .}) | from_entries) as $byid
            | .workspace_members as $members
            | .resolve.nodes[] | select(.id | IN($members[]) == $member)
            | $byid[.id] as $from
            | select($member or ($from.name | startswith("hax-") | not))
            | .deps[] | $byid[.pkg]
            | select((.name | startswith("hax-")) and .source != null)
            | "  \($from.name) depends on \(.name) \(.version) from \(.source)"' \
            <<<"$metadata" | sort -u
        }

        unpatched=$(stray true)
        if [ -n "$unpatched" ]; then
          echo "::error::these members of $project still depend on hax crates outside $hax:"
          echo "$unpatched"
          exit 1
        fi
        echo "every member of $project depends on the hax crates of $hax"

        # The dependencies below were built against their own hax crates, whose
        # F* libraries the standard extraction Makefile would also find. The
        # projects checked with this action take theirs from $hax explicitly.
        foreign=$(stray false)
        if [ -n "$foreign" ]; then
          echo "::warning::$project also resolves hax crates outside $hax, through these dependencies:"
          echo "$foreign"
        fi
